name: Release (NVIDIA compatibility build)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (for example v1.6.3-nvidia.1)"
        required: true
        type: string

concurrency:
  group: release-nvidia-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.tag }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          case "$VERSION" in
            v*) ;;
            *) echo "::error::Tag must start with 'v': $VERSION"; exit 1 ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION"

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: "1.27.3"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "25"

      - name: Initialize Go workspace
        run: source ./.github/workflows/scripts/setup-go-workspace.sh

      - name: Build Web UI
        run: make build-ui

      - name: Build bifrost-http (linux/amd64, static)
        run: |
          mkdir -p dist
          cd transports/bifrost-http
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 CC=gcc CXX=g++ go build \
            -trimpath \
            -tags "netgo,osusergo,sqlite_static" \
            -ldflags "-s -w -buildid= -extldflags '-static' -X main.Version=${{ steps.version.outputs.version }}" \
            -o ../../dist/bifrost-http-linux-amd64 .
          cd ../..
          (cd dist && sha256sum bifrost-http-linux-amd64 > bifrost-http-linux-amd64.sha256)
          ls -lh dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: bifrost-http-${{ steps.version.outputs.version }}-linux-amd64
          path: dist/
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/* --clobber
          else
            gh release create "$VERSION" dist/* \
              --title "$VERSION" \
              --generate-notes
          fi
